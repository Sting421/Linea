<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="background: #fff; border: 1px solid #E2E7EB; border-radius: 12px; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <div style="padding: 14px 18px 0;">
    <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; color: #1F4173;">{{ title }}</div>
  </div>
  <div style="display: flex; align-items: center; gap: 6px; padding: 4px 14px 16px;">
    <div style="width: 180px; height: 180px; flex: 0 0 auto;">
      <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
        {{ chartEl }}
      </sc-if>
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
        <div style="height: 100%; display: flex; align-items: center; justify-content: center; color: #B4BBC1; font-size: 13px;">Loading…</div>
      </sc-if>
    </div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 4px 0;">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #009DE4; flex: 0 0 auto;"></span>
        <span style="font-size: 13px; color: #3A434B; flex: 1 1 auto;">Normal</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: #20262B; font-variant-numeric: tabular-nums;">{{ nNormal }}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 4px 0;">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #E08600; flex: 0 0 auto;"></span>
        <span style="font-size: 13px; color: #3A434B; flex: 1 1 auto;">Warning</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: #20262B; font-variant-numeric: tabular-nums;">{{ nWarning }}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 4px 0;">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #6B7177; flex: 0 0 auto;"></span>
        <span style="font-size: 13px; color: #3A434B; flex: 1 1 auto;">Offline</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: #20262B; font-variant-numeric: tabular-nums;">{{ nOffline }}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 4px 0;">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #D92D20; flex: 0 0 auto;"></span>
        <span style="font-size: 13px; color: #3A434B; flex: 1 1 auto;">Fault</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: #20262B; font-variant-numeric: tabular-nums;">{{ nFault }}</span>
      </div>
      <sc-if value="{{ showAnomaly }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 8px; padding: 4px 0;">
          <span style="width: 10px; height: 10px; border-radius: 50%; background: #8B5CF6; flex: 0 0 auto;"></span>
          <span style="font-size: 13px; color: #3A434B; flex: 1 1 auto;">Anomaly</span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: #20262B; font-variant-numeric: tabular-nums;">{{ nAnomaly }}</span>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 400, &quot;height&quot;: 220}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Inverter status&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;counts&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;{ normal?: number; warning?: number; anomaly?: number; offline?: number; fault?: number }&quot;}}">
class Component extends DCLogic {
  constructor(props) { super(props); this._tries = 0; }
  componentDidMount() { this.waitForLib(); }
  waitForLib() {
    if (window.Recharts) { this.forceUpdate(); return; }
    if (this._tries++ < 150) setTimeout(() => this.waitForLib(), 60);
  }

  // NOTE: legacy InverterStatus fed Fault into normalCount, fixed here: each status is its own slice.
  counts() {
    return (this.props.counts && typeof this.props.counts === "object") ? this.props.counts : { normal: 18, warning: 3, anomaly: 1, offline: 1, fault: 2 };
  }

  buildChart() {
    const R = window.Recharts;
    const { ResponsiveContainer, PieChart, Pie, Cell, Tooltip } = R;
    const h = (...a) => React.createElement(...a);
    const COLOR = { normal: "#009DE4", warning: "#E08600", anomaly: "#8B5CF6", offline: "#6B7177", fault: "#D92D20" };
    const LABEL = { normal: "Normal", warning: "Warning", anomaly: "Anomaly", offline: "Offline", fault: "Fault" };
    const c = this.counts();
    const data = ["normal", "warning", "anomaly", "offline", "fault"]
      .map((k) => ({ key: k, label: LABEL[k], color: COLOR[k], value: c[k] || 0 }))
      .filter((r) => r.value > 0);
    const cells = data.map((r) => h(Cell, { key: r.key, fill: r.color, stroke: "#fff", strokeWidth: 2 }));
    const pie = h(Pie, { data, dataKey: "value", nameKey: "label", cx: "50%", cy: "50%", outerRadius: 84, isAnimationActive: false, startAngle: 90, endAngle: -270 }, cells);
    const tip = h(Tooltip, { contentStyle: { borderRadius: 8, border: "1px solid #E2E7EB", fontSize: 12, fontFamily: "'Space Grotesk', sans-serif" } });
    return h(ResponsiveContainer, { width: "100%", height: "100%" }, h(PieChart, null, pie, tip));
  }

  renderVals() {
    const ready = !!window.Recharts;
    const c = this.counts();
    return {
      ready, loading: !ready,
      chartEl: ready ? this.buildChart() : null,
      title: this.props.title ?? "Inverter status",
      nNormal: c.normal || 0, nWarning: c.warning || 0, nAnomaly: c.anomaly || 0, nOffline: c.offline || 0, nFault: c.fault || 0,
      showAnomaly: (c.anomaly || 0) > 0,
    };
  }
}
</script>
</body>
</html>
