<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="background: #fff; border: 1px solid #E2E7EB; border-radius: 12px; padding: 16px 18px 12px; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; gap: 10px;">
  <div style="font-size: 12.5px; color: #6B7177; font-weight: 500; letter-spacing: 0.01em;">{{ label }}</div>
  <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
    <div style="display: flex; align-items: baseline; gap: 5px;">
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 38px; color: #20262B; line-height: 1; letter-spacing: -0.015em;">{{ value }}</span>
      <span style="font-size: 14px; color: #8A9199; font-weight: 500;">{{ unit }}</span>
    </div>
    <sc-if value="{{ deltaGood }}" hint-placeholder-val="{{ true }}">
      <span style="display: inline-flex; align-items: center; font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; color: #15702F; background: #E7F8EC; border-radius: 999px; padding: 4px 11px; font-variant-numeric: tabular-nums; white-space: nowrap;">{{ deltaText }}</span>
    </sc-if>
    <sc-if value="{{ deltaBad }}" hint-placeholder-val="{{ false }}">
      <span style="display: inline-flex; align-items: center; font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; color: #9E1B12; background: #FDECEA; border-radius: 999px; padding: 4px 11px; font-variant-numeric: tabular-nums; white-space: nowrap;">{{ deltaText }}</span>
    </sc-if>
  </div>
  <div style="height: 44px; margin: 2px -2px 0;">
    <dc-import name="Sparkline" color="{{ sparkColor }}" values="{{ values }}" hint-size="100%,44px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 240, &quot;height&quot;: 150}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Today's yield&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;value&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;248.6&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;unit&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;kWh&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;delta&quot;: {&quot;editor&quot;: &quot;float&quot;, &quot;default&quot;: 4.2, &quot;tsType&quot;: &quot;number&quot;}, &quot;invertDelta&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;color&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#009DE4&quot;, &quot;options&quot;: [&quot;#009DE4&quot;, &quot;#1FA845&quot;, &quot;#E08600&quot;, &quot;#D92D20&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;values&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;number[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const delta = this.props.delta != null ? Number(this.props.delta) : 4.2;
    const up = delta >= 0;
    const good = this.props.invertDelta ? !up : up;
    return {
      label: this.props.label ?? "Today's yield",
      value: this.props.value ?? "248.6",
      unit: this.props.unit ?? "kWh",
      sparkColor: this.props.color ?? "#009DE4",
      values: Array.isArray(this.props.values) ? this.props.values : null,
      deltaText: (up ? "\u2191 " : "\u2193 ") + Math.abs(delta) + "%",
      deltaGood: good,
      deltaBad: !good,
    };
  }
}
</script>
</body>
</html>
