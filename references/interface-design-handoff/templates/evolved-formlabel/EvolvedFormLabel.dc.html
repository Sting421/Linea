<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Evolved · FormLabel" description="Brand-evolved field label, Space Grotesk in neutral ink with a fault-red required marker. Reskin target for the reap FormLabel; token-driven on the port." -->
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding:30px; display:flex; flex-direction:column; gap:18px; background:#fff;">
  <div style="display:flex; flex-direction:column; gap:14px; max-width:320px;">
    <label style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; color:#20262B; display:flex; align-items:center; gap:4px;">Plant name <span style="color:#D92D20; font-weight:700;">*</span></label>
    <label style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; color:#20262B;">Description</label>
  </div>
  <div style="font-size:12.5px; color:#8A9199; max-width:48ch; border-top:1px solid #EEF2F5; padding-top:14px; line-height:1.6;"><b style="color:#03587F; font-family:'Space Grotesk',sans-serif;">Evolved:</b> Space Grotesk label in neutral ink (<code style="font-family:'Space Grotesk',monospace;">#20262B</code>) with a fault-red required marker, driven by <code style="font-family:'Space Grotesk',monospace;">--status-fault</code> on the port.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 180}}"></script>
</body>
</html>
