<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Evolved · SearchInput" description="Brand-evolved search field, sky magnifier, soft sky surface, Space Grotesk. Reskin target for the reap SearchInput." -->
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding:30px; display:flex; flex-direction:column; gap:18px; background:#fff;">
  <div style="max-width:360px; display:flex; align-items:center; gap:10px; border:1px solid #CFE0EA; border-radius:10px; padding:11px 14px; background:#F7FBFE;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#03587F" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
    <span style="flex:1; font-size:13.5px; color:#8A9199;">Search plants…</span>
  </div>
  <div style="font-size:12.5px; color:#8A9199; max-width:48ch; border-top:1px solid #EEF2F5; padding-top:14px; line-height:1.6;"><b style="color:#03587F; font-family:'Space Grotesk',sans-serif;">Evolved:</b> sky magnifier on a soft sky surface with a focus ring, replacing the legacy plain search box.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 170}}"></script>
</body>
</html>
