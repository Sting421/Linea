<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<label style="display:inline-flex; align-items:center; gap:9px; cursor:pointer; font-family:ui-sans-serif, system-ui, sans-serif;">
  <sc-if value="{{ boxChecked }}" hint-placeholder-val="{{ true }}">
    <button type="button" role="checkbox" aria-checked="true" onClick="{{ toggle }}" style="flex:0 0 auto; width:18px; height:18px; border-radius:5px; border:1.5px solid #009DE4; background:#009DE4; display:inline-flex; align-items:center; justify-content:center; padding:0; cursor:pointer; transition:background .15s, border-color .15s;">
      <span style="width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span>
    </button>
  </sc-if>
  <sc-if value="{{ boxIndet }}" hint-placeholder-val="{{ false }}">
    <button type="button" role="checkbox" aria-checked="mixed" onClick="{{ toggle }}" style="flex:0 0 auto; width:18px; height:18px; border-radius:5px; border:1.5px solid #009DE4; background:#009DE4; display:inline-flex; align-items:center; justify-content:center; padding:0; cursor:pointer; transition:background .15s, border-color .15s;">
      <span style="width:9px; height:2px; background:#fff; border-radius:1px;"></span>
    </button>
  </sc-if>
  <sc-if value="{{ boxEmpty }}" hint-placeholder-val="{{ false }}">
    <button type="button" role="checkbox" aria-checked="false" onClick="{{ toggle }}" style="flex:0 0 auto; width:18px; height:18px; border-radius:5px; border:1.5px solid #B6BEC5; background:#fff; display:inline-flex; align-items:center; justify-content:center; padding:0; cursor:pointer; transition:background .15s, border-color .15s;"></button>
  </sc-if>
  <sc-if value="{{ hasText }}" hint-placeholder-val="{{ true }}">
    <span style="display:flex; flex-direction:column; gap:2px;">
      <span style="font-size:14px; color:#20262B; font-weight:500; line-height:1.3;">{{ label }}</span>
      <sc-if value="{{ hasSupport }}" hint-placeholder-val="{{ false }}">
        <span style="font-size:12.5px; color:#8A9199; line-height:1.4;">{{ supporting }}</span>
      </sc-if>
    </span>
  </sc-if>
</label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 260, &quot;height&quot;: 70}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Email alerts&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;supporting&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;checked&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;indeterminate&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;size&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;sm&quot;, &quot;md&quot;, &quot;lg&quot;], &quot;default&quot;: &quot;md&quot;, &quot;tsType&quot;: &quot;'sm'|'md'|'lg'&quot;}, &quot;colorScheme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;blue&quot;, &quot;green&quot;, &quot;amber&quot;, &quot;red&quot;, &quot;sky&quot;, &quot;slate&quot;], &quot;default&quot;: &quot;blue&quot;, &quot;tsType&quot;: &quot;'blue'|'green'|'amber'|'red'|'sky'|'slate'&quot;}, &quot;disabled&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: props.checked != null ? !!props.checked : false }; }
  renderVals() {
    const indeterminate = !!this.props.indeterminate;
    const disabled = !!this.props.disabled;
    const on = this.props.checked != null ? !!this.props.checked : this.state.on;
    const label = this.props.label;
    const hasText = label != null && label !== "";
    const supporting = this.props.supporting;
    const hasSupport = supporting != null && supporting !== "";
    return {
      toggle: () => { if (!disabled && this.props.checked == null) this.setState((st) => ({ on: !st.on })); },
      boxChecked: on && !indeterminate,
      boxIndet: indeterminate,
      boxEmpty: !on && !indeterminate,
      hasText, label,
      hasSupport, supporting,
    };
  }
}
</script>
</body>
</html>
