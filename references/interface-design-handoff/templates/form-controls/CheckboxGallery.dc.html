<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:24px 26px 26px; background:#fff; font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#1F4173;">

  <div style="margin-bottom:24px;">
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">States</div>
    <div style="display:flex; flex-wrap:wrap; gap:16px 26px; align-items:center;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;"><span style="width:18px; height:18px; border-radius:5px; border:1.5px solid #B6BEC5; background:#fff; display:inline-block;"></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">unchecked</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;"><span style="width:18px; height:18px; border-radius:5px; border:1.5px solid #009DE4; background:#009DE4; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">checked</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;"><span style="width:18px; height:18px; border-radius:5px; border:1.5px solid #009DE4; background:#009DE4; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:2px; background:#fff; border-radius:1px;"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">indeterminate</span></div>
      <span style="display:inline-flex; align-items:center; gap:9px;"><span style="width:18px; height:18px; border-radius:5px; border:1.5px solid #009DE4; background:#009DE4; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span></span><span style="font-size:14px; color:#20262B; font-weight:500;">Email alerts</span></span>
    </div>
  </div>

  <div style="margin-bottom:24px;">
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">Sizes</div>
    <div style="display:flex; flex-wrap:wrap; gap:16px 22px; align-items:center;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;"><span style="width:16px; height:16px; border-radius:4px; border:1.5px solid #009DE4; background:#009DE4; display:inline-flex; align-items:center; justify-content:center;"><span style="width:8px; height:4px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">sm</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;"><span style="width:18px; height:18px; border-radius:5px; border:1.5px solid #009DE4; background:#009DE4; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">md</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;"><span style="width:22px; height:22px; border-radius:6px; border:1.5px solid #009DE4; background:#009DE4; display:inline-flex; align-items:center; justify-content:center;"><span style="width:11px; height:6px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">lg</span></div>
    </div>
  </div>

  <div style="margin-bottom:24px;">
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">Variant colors</div>
    <div style="display:flex; flex-wrap:wrap; gap:16px 22px; align-items:center;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;"><span style="width:18px; height:18px; border-radius:5px; background:#009DE4; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">blue</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;"><span style="width:18px; height:18px; border-radius:5px; background:#1FA845; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">green</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;"><span style="width:18px; height:18px; border-radius:5px; background:#E08600; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">amber</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;"><span style="width:18px; height:18px; border-radius:5px; background:#D92D20; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">red</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;"><span style="width:18px; height:18px; border-radius:5px; background:#03587F; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">sky</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;"><span style="width:18px; height:18px; border-radius:5px; background:#46505A; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">slate</span></div>
    </div>
  </div>

  <div>
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">Disabled</div>
    <div style="display:flex; flex-wrap:wrap; gap:16px 26px; align-items:center;">
      <span style="display:inline-flex; align-items:center; gap:9px; opacity:.5;"><span style="width:18px; height:18px; border-radius:5px; border:1.5px solid #B6BEC5; background:#fff; display:inline-block;"></span><span style="font-size:14px; color:#20262B; font-weight:500;">Unchecked</span></span>
      <span style="display:inline-flex; align-items:center; gap:9px; opacity:.5;"><span style="width:18px; height:18px; border-radius:5px; background:#009DE4; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:translateY(-12%) rotate(-45deg);"></span></span><span style="font-size:14px; color:#20262B; font-weight:500;">Checked</span></span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 560, &quot;height&quot;: 460}}"></script>
</body>
</html>
