<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="radiogroup" style="display:flex; flex-direction:column; gap:13px; font-family:ui-sans-serif, system-ui, sans-serif;">
  <sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
    <label style="display:inline-flex; align-items:center; gap:9px; cursor:pointer;">
      <sc-if value="{{ o.selected }}" hint-placeholder-val="{{ false }}">
        <button type="button" role="radio" aria-checked="true" onClick="{{ o.onClick }}" style="flex:0 0 auto; width:18px; height:18px; border-radius:50%; border:1.5px solid #009DE4; background:#fff; display:inline-flex; align-items:center; justify-content:center; padding:0; cursor:pointer; transition:border-color .15s;">
          <span style="width:9px; height:9px; border-radius:50%; background:#009DE4;"></span>
        </button>
      </sc-if>
      <sc-if value="{{ o.unselected }}" hint-placeholder-val="{{ true }}">
        <button type="button" role="radio" aria-checked="false" onClick="{{ o.onClick }}" style="flex:0 0 auto; width:18px; height:18px; border-radius:50%; border:1.5px solid #B6BEC5; background:#fff; display:inline-flex; align-items:center; justify-content:center; padding:0; cursor:pointer; transition:border-color .15s;"></button>
      </sc-if>
      <span style="display:flex; flex-direction:column; gap:2px;">
        <span style="font-size:14px; color:#20262B; font-weight:500; line-height:1.3;">{{ o.label }}</span>
        <sc-if value="{{ o.hasSupport }}" hint-placeholder-val="{{ false }}">
          <span style="font-size:12.5px; color:#8A9199; line-height:1.4;">{{ o.supporting }}</span>
        </sc-if>
      </span>
    </label>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 260, &quot;height&quot;: 120}, &quot;selectedIndex&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 0, &quot;tsType&quot;: &quot;number&quot;}, &quot;size&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;sm&quot;, &quot;md&quot;, &quot;lg&quot;], &quot;default&quot;: &quot;md&quot;, &quot;tsType&quot;: &quot;'sm'|'md'|'lg'&quot;}, &quot;colorScheme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;blue&quot;, &quot;green&quot;, &quot;amber&quot;, &quot;red&quot;, &quot;sky&quot;, &quot;slate&quot;], &quot;default&quot;: &quot;blue&quot;, &quot;tsType&quot;: &quot;'blue'|'green'|'amber'|'red'|'sky'|'slate'&quot;}, &quot;horizontal&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;disabled&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;items&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;Array&lt;{ label: string; supporting?: string; disabled?: boolean }&gt;&quot;}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: props.selectedIndex != null ? Number(props.selectedIndex) : 0 }; }
  renderVals() {
    const items = Array.isArray(this.props.items) && this.props.items.length
      ? this.props.items
      : [{ label: "Aggregator" }, { label: "Utility" }, { label: "End-user" }];
    const sel = this.props.selectedIndex != null ? Number(this.props.selectedIndex) : this.state.sel;
    const disabledAll = !!this.props.disabled;
    const options = items.map((it, i) => {
      const selected = i === sel;
      const disabled = disabledAll || !!it.disabled;
      const hasSupport = it.supporting != null && it.supporting !== "";
      return {
        selected, unselected: !selected,
        onClick: () => { if (!disabled && this.props.selectedIndex == null) this.setState({ sel: i }); },
        hasSupport, supporting: it.supporting,
        label: it.label,
      };
    });
    return { options };
  }
}
</script>
</body>
</html>
