<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:24px 26px 26px; background:#fff; font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#1F4173;">

  <div style="margin-bottom:24px;">
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">Group</div>
    <div style="display:flex; flex-direction:column; gap:13px;">
      <span style="display:inline-flex; align-items:center; gap:9px;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #009DE4; background:#fff; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:9px; border-radius:50%; background:#009DE4;"></span></span><span style="font-size:14px; color:#20262B; font-weight:500;">Aggregator</span></span>
      <span style="display:inline-flex; align-items:center; gap:9px;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #B6BEC5; background:#fff; display:inline-flex;"></span><span style="font-size:14px; color:#20262B; font-weight:500;">Utility</span></span>
      <span style="display:inline-flex; align-items:center; gap:9px;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #B6BEC5; background:#fff; display:inline-flex;"></span><span style="font-size:14px; color:#20262B; font-weight:500;">End-user</span></span>
    </div>
  </div>

  <div style="margin-bottom:24px;">
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">Variant colors</div>
    <div style="display:flex; flex-wrap:wrap; gap:16px 22px; align-items:flex-start;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:9px;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #009DE4; background:#fff; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:9px; border-radius:50%; background:#009DE4;"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">blue</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:9px;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #1FA845; background:#fff; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:9px; border-radius:50%; background:#1FA845;"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">green</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:9px;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #E08600; background:#fff; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:9px; border-radius:50%; background:#E08600;"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">amber</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:9px;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #D92D20; background:#fff; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:9px; border-radius:50%; background:#D92D20;"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">red</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:9px;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #03587F; background:#fff; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:9px; border-radius:50%; background:#03587F;"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">sky</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:9px;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #46505A; background:#fff; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:9px; border-radius:50%; background:#46505A;"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">slate</span></div>
    </div>
  </div>

  <div style="margin-bottom:24px;">
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">Sizes</div>
    <div style="display:flex; flex-wrap:wrap; gap:16px 22px; align-items:center;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:9px;"><span style="width:16px; height:16px; border-radius:50%; border:1.5px solid #009DE4; background:#fff; display:inline-flex; align-items:center; justify-content:center;"><span style="width:8px; height:8px; border-radius:50%; background:#009DE4;"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">sm</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:9px;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #009DE4; background:#fff; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:9px; border-radius:50%; background:#009DE4;"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">md</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:9px;"><span style="width:22px; height:22px; border-radius:50%; border:1.5px solid #009DE4; background:#fff; display:inline-flex; align-items:center; justify-content:center;"><span style="width:11px; height:11px; border-radius:50%; background:#009DE4;"></span></span><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">lg</span></div>
    </div>
  </div>

  <div>
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">Disabled</div>
    <div style="display:flex; flex-wrap:wrap; gap:16px 26px; align-items:center;">
      <span style="display:inline-flex; align-items:center; gap:9px; opacity:.5;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #B6BEC5; background:#fff; display:inline-flex;"></span><span style="font-size:14px; color:#20262B; font-weight:500;">Unselected</span></span>
      <span style="display:inline-flex; align-items:center; gap:9px; opacity:.5;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #009DE4; background:#fff; display:inline-flex; align-items:center; justify-content:center;"><span style="width:9px; height:9px; border-radius:50%; background:#009DE4;"></span></span><span style="font-size:14px; color:#20262B; font-weight:500;">Selected</span></span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 560, &quot;height&quot;: 400}}"></script>
</body>
</html>
