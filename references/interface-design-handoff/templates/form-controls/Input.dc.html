<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
</helmet>
<div style="display:flex; flex-direction:column; gap:6px; width:100%; font-family:ui-sans-serif, system-ui, -apple-system, sans-serif;">
  <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}">
    <label style="font-size:13px; font-weight:600; color:#3A434B;">{{ label }}<sc-if value="{{ required }}" hint-placeholder-val="{{ false }}"><span style="color:#D92D20;"> *</span></sc-if></label>
  </sc-if>
  <div style="display:flex; align-items:center; gap:8px; width:100%; background:#fff; border:1px solid #CDD5DB; border-radius:9px; padding:0 12px; height:40px; box-shadow:0 0 0 3px transparent; transition:border-color .15s, box-shadow .15s;">
    <sc-if value="{{ hasLeading }}" hint-placeholder-val="{{ false }}">
      <span style="color:#8A9199; font-size:14px; display:inline-flex; flex:0 0 auto;">{{ leading }}</span>
    </sc-if>
    <input type="{{ type }}" placeholder="{{ placeholder }}" value="{{ value }}" disabled="{{ disabled }}" style="flex:1 1 auto; min-width:0; border:none; outline:none; background:transparent; font-size:14px; color:#20262B; font-family:inherit; padding:9px 0;" />
    <sc-if value="{{ hasTrailing }}" hint-placeholder-val="{{ false }}">
      <span style="color:#8A9199; font-size:14px; display:inline-flex; flex:0 0 auto;">{{ trailing }}</span>
    </sc-if>
    <sc-if value="{{ invalid }}" hint-placeholder-val="{{ false }}">
      <span style="flex:0 0 auto; width:18px; height:18px; border-radius:50%; background:#FDECEA; color:#D92D20; font-weight:700; font-family:'Space Grotesk', sans-serif; display:inline-flex; align-items:center; justify-content:center; font-size:13px;">!</span>
    </sc-if>
  </div>
  <sc-if value="{{ hasHint }}" hint-placeholder-val="{{ false }}">
    <span style="font-size:12.5px; color:#8A9199; line-height:1.4;">{{ hint }}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 320, &quot;height&quot;: 90}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Plant name&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;placeholder&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;e.g. Maple Grove&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;value&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;hint&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;type&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;text&quot;, &quot;email&quot;, &quot;password&quot;, &quot;number&quot;, &quot;search&quot;], &quot;default&quot;: &quot;text&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;size&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;sm&quot;, &quot;md&quot;, &quot;lg&quot;], &quot;default&quot;: &quot;md&quot;, &quot;tsType&quot;: &quot;'sm'|'md'|'lg'&quot;}, &quot;leading&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;trailing&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;invalid&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;disabled&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;required&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const label = this.props.label;
    const hasLabel = label != null && label !== "";
    const hint = this.props.hint;
    const hasHint = hint != null && hint !== "";
    const leading = this.props.leading;
    const trailing = this.props.trailing;
    return {
      hasLabel, label,
      required: !!this.props.required,
      hasLeading: leading != null && leading !== "", leading,
      hasTrailing: trailing != null && trailing !== "", trailing,
      type: this.props.type || "text",
      placeholder: this.props.placeholder ?? "Placeholder",
      value: this.props.value ?? "",
      disabled: !!this.props.disabled,
      invalid: !!this.props.invalid,
      hasHint, hint,
    };
  }
}
</script>
</body>
</html>
