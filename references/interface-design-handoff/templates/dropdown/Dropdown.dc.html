<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Dropdown" description="Action / context menu shown in its open state, trigger button plus a floating panel with section label, icon items, a checkbox toggle item, dividers, keyboard shortcut and a destructive item. Net-new, used by Area 1 fleet filters and Area 3 bulk incident actions." -->
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #20262B; background: #F4F7F9; padding: 26px; display: flex; flex-direction: column; align-items: center; gap: 12px;">

  <button type="button" style="display: inline-flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; color: #20262B; background: #fff; border: 1px solid #D4D8DB; border-radius: 9px; padding: 8px 13px; cursor: pointer; box-shadow: 0 1px 2px rgba(31,65,115,0.06);">
    Bulk actions
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7B848C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </button>

  <div style="width: 256px; background: #fff; border: 1px solid #E2E7EB; border-radius: 12px; box-shadow: 0 10px 30px rgba(31,65,115,0.16); padding: 6px; display: flex; flex-direction: column;">
    <div style="font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #9AA3AB; font-weight: 600; padding: 8px 10px 5px;">Apply to 3 selected</div>

    <button type="button" style="display: flex; align-items: center; gap: 11px; width: 100%; box-sizing: border-box; text-align: left; background: transparent; border: none; border-radius: 7px; padding: 8px 10px; font-size: 13.5px; color: #20262B; cursor: pointer; font-family: inherit;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#46505A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      Acknowledge
    </button>

    <div style="display: flex; align-items: center; gap: 11px; width: 100%; box-sizing: border-box; background: #F2F8FB; border-radius: 7px; padding: 8px 10px; font-size: 13.5px; color: #20262B; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#03587F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span style="flex: 1 1 auto;">Mute notifications</span>
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 5px; background: #009DE4;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
    </div>

    <div style="height: 1px; background: #EEF2F5; margin: 5px 6px;"></div>

    <button type="button" style="display: flex; align-items: center; gap: 11px; width: 100%; box-sizing: border-box; text-align: left; background: transparent; border: none; border-radius: 7px; padding: 8px 10px; font-size: 13.5px; color: #20262B; cursor: pointer; font-family: inherit;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#46505A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span style="flex: 1 1 auto;">Export CSV</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 11.5px; color: #9AA3AB; letter-spacing: 0.02em;">⌘E</span>
    </button>

    <div style="height: 1px; background: #EEF2F5; margin: 5px 6px;"></div>

    <button type="button" style="display: flex; align-items: center; gap: 11px; width: 100%; box-sizing: border-box; text-align: left; background: transparent; border: none; border-radius: 7px; padding: 8px 10px; font-size: 13.5px; color: #9E1B12; cursor: pointer; font-family: inherit;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9E1B12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      Delete events
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 380}}"></script>
</body>
</html>
