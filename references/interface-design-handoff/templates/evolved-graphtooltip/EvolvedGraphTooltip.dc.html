<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Evolved · GraphTooltip" description="Brand-evolved chart-point tooltip surface, white card, status-palette accent dot, Space Grotesk value. Reskin target for the reap GraphTooltip; status color comes from --status-* on the repo port." -->
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding:26px 30px; background:#fff; display:grid; grid-template-columns:auto 1fr; gap:30px; align-items:center;">
  <div style="display:flex; gap:16px; flex-wrap:wrap;">
    <div style="background:#fff; border:1px solid #E2E7EB; border-radius:10px; box-shadow:0 8px 22px rgba(31,65,115,0.14); padding:11px 14px; min-width:148px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="width:9px; height:9px; border-radius:50%; background:#009DE4;"></span>
        <span style="font-size:12.5px; color:#8A9199; white-space:nowrap;">Solar output</span>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:19px; color:#20262B; margin-top:4px;">4.2 kW</div>
    </div>
    <div style="background:#fff; border:1px solid #E2E7EB; border-radius:10px; box-shadow:0 8px 22px rgba(31,65,115,0.14); padding:11px 14px; min-width:148px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="width:9px; height:9px; border-radius:50%; background:#1FA845;"></span>
        <span style="font-size:12.5px; color:#8A9199; white-space:nowrap;">Battery</span>
      </div>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:19px; color:#20262B; margin-top:4px;">78%</div>
    </div>
  </div>
  <div style="font-size:12.5px; color:#8A9199; line-height:1.6; border-left:1px solid #EEF2F5; padding-left:26px;">
    <b style="color:#03587F; font-family:'Space Grotesk',sans-serif;">Evolved:</b> white surface, Ovanova shadow, Space Grotesk value; the accent dot reads the status palette (<code style="font-family:'Space Grotesk',monospace;">--status-*</code>) instead of raw chart hex.
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 560, &quot;height&quot;: 180}}"></script>
</body>
</html>
