<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Evolved · Carousel" description="Brand-evolved slide carousel, branded slide surfaces with sky dot controls. Reskin target for the reap Carousel (react-alice-carousel)." -->
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding:28px; display:flex; flex-direction:column; gap:18px; background:#fff;">
  <div style="display:flex; gap:12px;">
    <div style="flex:1; height:104px; border-radius:12px; display:flex; align-items:flex-end; padding:14px; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; background:linear-gradient(150deg,#1F4173,#03587F);">Riverside Solar</div>
    <div style="flex:1; height:104px; border-radius:12px; display:flex; align-items:flex-end; padding:14px; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; background:linear-gradient(150deg,#03587F,#009DE4);">Harbor Microgrid</div>
    <div style="flex:1; height:104px; border-radius:12px; display:flex; align-items:flex-end; padding:14px; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; background:linear-gradient(150deg,#009DE4,#0081F8);">Desert Array</div>
  </div>
  <div style="display:flex; gap:7px; justify-content:center;">
    <span style="width:9px; height:9px; border-radius:999px; background:#009DE4;"></span>
    <span style="width:9px; height:9px; border-radius:999px; background:#CDDEEF;"></span>
    <span style="width:9px; height:9px; border-radius:999px; background:#CDDEEF;"></span>
  </div>
  <div style="font-size:12.5px; color:#8A9199; max-width:52ch; border-top:1px solid #EEF2F5; padding-top:14px; line-height:1.6;"><b style="color:#03587F; font-family:'Space Grotesk',sans-serif;">Evolved:</b> branded slide surfaces (sky→navy ramp) with sky dot controls and Space Grotesk captions, replacing the default carousel chrome.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 520, &quot;height&quot;: 230}}"></script>
</body>
</html>
