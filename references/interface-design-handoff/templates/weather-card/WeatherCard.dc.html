<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="background:#fff;border:1px solid #E2E7EB;border-radius:14px;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;width:660px;max-width:100%;box-sizing:border-box;margin:0 auto;">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:16px 14px 12px;">
    <div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:#1F4173;">{{ location }}</div>
      <div style="font-size:11px;color:#8A9199;margin-top:3px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">This week</div>
    </div>
  </div>

  <div style="display:flex;gap:10px;padding:0 14px 14px;align-items:stretch;">
    <div style="flex:1;background:linear-gradient(135deg,#EFF6FD,#F8FAFC);border:1px solid #E4EDF6;border-radius:12px;padding:14px 16px;box-sizing:border-box;">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;color:#1F4173;">{{ date }}</div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:8px;">
        <div style="flex:none;display:flex;">{{ currentIcon }}</div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;color:#20262B;line-height:0.95;">{{ currentTemp }}</div>
      </div>
      <div style="font-size:13px;color:#5A636B;margin-top:10px;">{{ currentCond }} · Feels {{ feels }}</div>
    </div>

    <div style="flex:none;width:112px;display:flex;flex-direction:column;gap:10px;">
      <div style="flex:1;background:#FAFBFC;border:1px solid #EEF1F4;border-radius:12px;padding:11px 12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;">
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="flex:none;display:flex;">{{ syncIcon }}</div>
          <div style="font-size:11px;color:#8A9199;font-weight:600;">Updated</div>
        </div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:#20262B;margin-top:5px;">{{ updated }}</div>
      </div>
      <div style="flex:1;background:#FAFBFC;border:1px solid #EEF1F4;border-radius:12px;padding:11px 12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;">
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="flex:none;display:flex;">{{ sunIcon }}</div>
          <div style="font-size:11px;color:#8A9199;font-weight:600;">Irradiance</div>
        </div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:#009DE4;margin-top:5px;">{{ irradiance }}</div>
        {{ irradianceGauge }}
      </div>
    </div>
  </div>

  <div style="font-size:11px;color:#8A9199;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;padding:0 14px 8px;">Next 6 days</div>

  <div style="display:flex;gap:6px;padding:0 14px 16px;">
    <sc-for list="{{ days }}" as="d" hint-placeholder-count="6">
      <div style="flex:1;background:#FAFBFC;border:1px solid #EEF1F4;border-radius:10px;padding:10px 3px 11px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="font-size:10.5px;font-weight:700;color:#8A9199;text-transform:uppercase;letter-spacing:0.04em;">{{ d.d }}</div>
        {{ d.iconEl }}
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;color:#20262B;">{{ d.hi }}</div>
        <div style="font-size:11px;color:#B4BBC1;">{{ d.lo }}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:660,&quot;height&quot;:410},&quot;location&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dome · NSW&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Today · Fri, Jan 4&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;currentTemp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;31°&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;currentCond&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sunny&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;feels&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;33°&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;irradiance&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;742 W/m²&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;updated&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9:40 AM&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  icon(type, size) {
    const h = (...a) => React.createElement(...a);
    const s = size || 30;
    const wrap = (...k) => h("svg", { width: s, height: s, viewBox: "0 0 40 40", fill: "none" }, ...k);
    const sunC = "#F5A623", cloudC = "#C2CCD6", darkCloud = "#A7B4C0", rainC = "#4FA3E0";
    const sun = (cx, cy, r) => h("g", { key: "s" },
      h("circle", { cx, cy, r, fill: sunC }),
      ...[0, 45, 90, 135, 180, 225, 270, 315].map((deg, i) => {
        const a = deg * Math.PI / 180;
        const x1 = cx + Math.cos(a) * (r + 3), y1 = cy + Math.sin(a) * (r + 3);
        const x2 = cx + Math.cos(a) * (r + 6), y2 = cy + Math.sin(a) * (r + 6);
        return h("line", { key: i, x1, y1, x2, y2, stroke: sunC, strokeWidth: 2, strokeLinecap: "round" });
      })
    );
    const cloud = (col, ox, oy) => h("g", { key: "c", transform: "translate(" + (ox || 0) + "," + (oy || 0) + ")" },
      h("circle", { cx: 15, cy: 24, r: 7, fill: col }),
      h("circle", { cx: 24, cy: 21, r: 9, fill: col }),
      h("circle", { cx: 31, cy: 25, r: 6, fill: col }),
      h("rect", { x: 12, y: 25, width: 21, height: 8, rx: 4, fill: col })
    );
    if (type === "pcloud") return wrap(sun(14, 15, 6), cloud(cloudC, 4, 5));
    if (type === "cloud") return wrap(cloud(darkCloud, 0, 2));
    if (type === "rain") return wrap(cloud(darkCloud, 0, -2),
      ...[16, 22, 28].map((x, i) => h("line", { key: "r" + i, x1: x, y1: 30, x2: x - 2, y2: 37, stroke: rainC, strokeWidth: 2.2, strokeLinecap: "round" })));
    return wrap(sun(20, 20, 9));
  }
  uiIcon(type, size, color) {
    const h = (...a) => React.createElement(...a);
    const s = size || 15, c = color || "#1F4173";
    if (type === "sync") return h("svg", { width: s, height: s, viewBox: "0 0 24 24", fill: "none" },
      h("path", { d: "M20.5 12a8.5 8.5 0 1 1-2.6-6.1", stroke: c, strokeWidth: 2, strokeLinecap: "round" }),
      h("path", { d: "M20.7 3.7v4.6h-4.6", stroke: c, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" })
    );
    return null;
  }
  gauge(pct) {
    const h = (...a) => React.createElement(...a);
    return h("div", { style: { height: 6, borderRadius: 6, background: "#E9EFF4", overflow: "hidden", marginTop: 9 } },
      h("div", { style: { height: "100%", width: pct + "%", borderRadius: 6, background: "linear-gradient(90deg,#009DE4,#F5A623)" } })
    );
  }
  renderVals() {
    const p = this.props;
    const def = [["Mon", "sun", 32, 19], ["Tue", "pcloud", 30, 18], ["Wed", "cloud", 27, 17], ["Thu", "rain", 24, 16], ["Fri", "pcloud", 28, 18], ["Sat", "sun", 33, 20]];
    const days = def.map(([d, t, hi, lo]) => ({ d, iconEl: this.icon(t, 28), hi: hi + "°", lo: lo + "°" }));
    const irrNum = parseFloat(String(p.irradiance ?? "742").replace(/[^0-9.]/g, "")) || 0;
    const pct = Math.max(5, Math.min(100, Math.round(irrNum / 1000 * 100)));
    return {
      location: p.location ?? "Dome · NSW",
      date: p.date ?? "Today · Fri, Jan 4",
      updated: p.updated ?? "9:40 AM",
      currentTemp: p.currentTemp ?? "31°",
      currentCond: p.currentCond ?? "Sunny",
      feels: p.feels ?? "33°",
      irradiance: p.irradiance ?? "742 W/m²",
      currentIcon: this.icon("sun", 44),
      syncIcon: this.uiIcon("sync", 15, "#1F4173"),
      sunIcon: this.icon("sun", 16),
      irradianceGauge: this.gauge(pct),
      days,
    };
  }
}
</script>
</body>
</html>
