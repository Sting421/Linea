<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Evolved · ErrorElement" description="Brand-evolved empty/error state, sky glyph, Space Grotesk heading, muted guidance. Reskin target for the reap ErrorElement." -->
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding:30px; display:flex; flex-direction:column; gap:18px; background:#fff;">
  <div style="border:1px solid #E1EBEF; border-radius:12px; padding:30px 24px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; background:#F7FBFE;">
    <span style="width:44px; height:44px; border-radius:50%; background:#E6F7FF; color:#03587F; display:flex; align-items:center; justify-content:center; font-size:23px; font-weight:700; font-family:'Space Grotesk',sans-serif;">!</span>
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15.5px; color:#20262B;">No data available</div>
    <div style="font-size:13px; color:#8A9199; max-width:34ch; line-height:1.5;">This region failed to load. Check the device connection or retry.</div>
  </div>
  <div style="font-size:12.5px; color:#8A9199; max-width:48ch; border-top:1px solid #EEF2F5; padding-top:14px; line-height:1.6;"><b style="color:#03587F; font-family:'Space Grotesk',sans-serif;">Evolved:</b> branded empty/error surface, sky glyph + Space Grotesk, replacing the unstyled legacy placeholder.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 420, &quot;height&quot;: 270}}"></script>
</body>
</html>
