<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Evolved · HelperDialog" description="Brand-evolved help affordance, sky help trigger revealing a white card with guidance + a sky link. Reskin target for the reap HelperDialog." -->
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;}</style>
</helmet>
<div style="font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding:30px 30px 44px; display:flex; flex-direction:column; gap:20px; background:#fff;">
  <div style="display:flex; align-items:center; gap:9px;">
    <span style="font-size:15px; color:#20262B; font-weight:500;">Inverter metrics</span>
    <span onClick="{{ onToggle }}" style="position:relative; display:inline-flex;">
      <span style="width:19px; height:19px; border-radius:50%; background:#E6F7FF; color:#03587F; border:1px solid #8AD9FD; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:'Space Grotesk',sans-serif; cursor:pointer;">?</span>
      <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
        <span style="position:absolute; top:150%; left:0; background:#fff; border:1px solid #E2E7EB; border-radius:10px; padding:12px 14px; width:236px; box-shadow:0 10px 28px rgba(31,65,115,0.2); z-index:5;">
          <span style="display:block; font-size:13px; color:#46505A; line-height:1.5;">How inverter metrics are calculated, from raw telemetry to displayed kW.</span>
          <span style="display:block; margin-top:9px; font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:600; color:#009DE4;">Learn more →</span>
        </span>
      </sc-if>
    </span>
  </div>
  <div style="font-size:12.5px; color:#8A9199; max-width:48ch; border-top:1px solid #EEF2F5; padding-top:14px; line-height:1.6;"><b style="color:#03587F; font-family:'Space Grotesk',sans-serif;">Evolved:</b> sky "?" trigger opening a white card with Space Grotesk link, replacing the legacy gray dialog.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 440, &quot;height&quot;: 240}}">
class Component extends DCLogic {
  state = { open: true };
  renderVals() {
    return { open: this.state.open, onToggle: () => this.setState({ open: !this.state.open }) };
  }
}
</script>
</body>
</html>
