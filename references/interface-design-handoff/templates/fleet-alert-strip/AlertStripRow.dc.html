<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Fleet · Alert strip row" description="Compact severity-coded alert item for the Active Alerts strip (Area 1) — deep-links to Area 3. Severity dot + title + device/context subtitle + severity badge (with optional ×count) + timestamp. Rows stack in a card." -->
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="display:flex;align-items:center;gap:12px;padding:11px 12px;font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;border-radius:10px;cursor:pointer;background:#FFFFFF;" style-hover="background:#F7FAFC;">
  <sc-if value="{{ isNormal }}" hint-placeholder-val="{{ false }}"><span style="width:9px;height:9px;border-radius:50%;background:#009DE4;flex:0 0 auto;"></span></sc-if>
  
  <sc-if value="{{ isWarning }}" hint-placeholder-val="{{ false }}"><span style="width:9px;height:9px;border-radius:50%;background:#E08600;flex:0 0 auto;"></span></sc-if>
  <sc-if value="{{ isOffline }}" hint-placeholder-val="{{ false }}"><span style="width:9px;height:9px;border-radius:50%;background:#6B7177;flex:0 0 auto;"></span></sc-if>
  <sc-if value="{{ isAnomaly }}" hint-placeholder-val="{{ false }}"><span style="width:9px;height:9px;border-radius:50%;background:#8B5CF6;flex:0 0 auto;"></span></sc-if>
  <sc-if value="{{ isFault }}" hint-placeholder-val="{{ true }}"><span style="width:9px;height:9px;border-radius:50%;background:#D92D20;flex:0 0 auto;box-shadow:0 0 0 3px #FDECEA;"></span></sc-if>
  <div style="flex:1;min-width:0;">
    <div style="font-size:13px;font-weight:600;color:#17222E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ title }}</div>
    <div style="font-size:11.5px;font-weight:500;color:#8A9199;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;">{{ subtitle }}</div>
  </div>
  <sc-if value="{{ isNormal }}" hint-placeholder-val="{{ false }}">
    <span style="display:inline-flex;align-items:center;gap:5px;font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;font-size:10.5px;font-weight:700;line-height:1;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap;flex:0 0 auto;border-radius:999px;padding:4px 9px;background:#E6F7FF;color:#03587F;border:1px solid #8AD9FD;">
      <span>{{ badgeLabel }}</span>
      <sc-if value="{{ showCount }}" hint-placeholder-val="{{ false }}"><span style="font-weight:500;opacity:0.75;font-variant-numeric:tabular-nums;">{{ countText }}</span></sc-if>
    </span>
  </sc-if>
  
  <sc-if value="{{ isWarning }}" hint-placeholder-val="{{ false }}">
    <span style="display:inline-flex;align-items:center;gap:5px;font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;font-size:10.5px;font-weight:700;line-height:1;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap;flex:0 0 auto;border-radius:999px;padding:4px 9px;background:#FFF4E2;color:#8F5500;border:1px solid #F8D399;">
      <span>{{ badgeLabel }}</span>
      <sc-if value="{{ showCount }}" hint-placeholder-val="{{ false }}"><span style="font-weight:500;opacity:0.75;font-variant-numeric:tabular-nums;">{{ countText }}</span></sc-if>
    </span>
  </sc-if>
  <sc-if value="{{ isOffline }}" hint-placeholder-val="{{ false }}">
    <span style="display:inline-flex;align-items:center;gap:5px;font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;font-size:10.5px;font-weight:700;line-height:1;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap;flex:0 0 auto;border-radius:999px;padding:4px 9px;background:#EEF0F1;color:#474C51;border:1px solid #CDD1D4;">
      <span>{{ badgeLabel }}</span>
      <sc-if value="{{ showCount }}" hint-placeholder-val="{{ false }}"><span style="font-weight:500;opacity:0.75;font-variant-numeric:tabular-nums;">{{ countText }}</span></sc-if>
    </span>
  </sc-if>
  <sc-if value="{{ isAnomaly }}" hint-placeholder-val="{{ false }}">
    <span style="display:inline-flex;align-items:center;gap:5px;font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;font-size:10.5px;font-weight:700;line-height:1;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap;flex:0 0 auto;border-radius:999px;padding:4px 9px;background:#F1EAFE;color:#5B21B6;border:1px solid #C9B2FA;">
      <span>{{ badgeLabel }}</span>
      <sc-if value="{{ showCount }}" hint-placeholder-val="{{ false }}"><span style="font-weight:500;opacity:0.75;font-variant-numeric:tabular-nums;">{{ countText }}</span></sc-if>
    </span>
  </sc-if>
  <sc-if value="{{ isFault }}" hint-placeholder-val="{{ true }}">
    <span style="display:inline-flex;align-items:center;gap:5px;font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;font-size:10.5px;font-weight:700;line-height:1;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap;flex:0 0 auto;border-radius:999px;padding:4px 9px;background:#FDECEA;color:#9E1B12;border:1px solid #F4B5AE;">
      <span>{{ badgeLabel }}</span>
      <sc-if value="{{ showCount }}" hint-placeholder-val="{{ false }}"><span style="font-weight:500;opacity:0.75;font-variant-numeric:tabular-nums;">{{ countText }}</span></sc-if>
    </span>
  </sc-if>
  <span style="display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:#AAB1B8;white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto;">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    <span>{{ time }}</span>
  </span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 460, &quot;height&quot;: 64}, &quot;status&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;normal&quot;, &quot;warning&quot;, &quot;offline&quot;, &quot;fault&quot;, &quot;anomaly&quot;], &quot;default&quot;: &quot;fault&quot;, &quot;tsType&quot;: &quot;'normal' | 'warning' | 'offline' | 'fault' | 'anomaly'&quot;}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;No AC Connection&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;subtitle&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Liberty Hill Farms · inv 4392670247&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;count&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 6, &quot;tsType&quot;: &quot;number&quot;}, &quot;time&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;8:01&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const NAME = { normal: "Normal", warning: "Warning", offline: "Offline", fault: "Fault", anomaly: "Anomaly" };
    const raw = String(this.props.status || "fault").toLowerCase();
    const status = raw === "online" ? "normal" : raw;
    const title = this.props.title ?? "No AC Connection";
    const subtitle = this.props.subtitle ?? "Liberty Hill Farms · inv 4392670247";
    const time = this.props.time ?? "8:01";
    const label = (this.props.label != null && this.props.label !== "") ? this.props.label : (NAME[status] || "Fault");
    const count = this.props.count;
    const showCount = count != null && count !== "" && Number(count) > 1;
    return {
      isNormal: status === "normal", isWarning: status === "warning", isOffline: status === "offline", isFault: status === "fault", isAnomaly: status === "anomaly",
      title, subtitle, time, badgeLabel: label, showCount, countText: " \u00d7" + count,
    };
  }
}
</script>
</body>
</html>
