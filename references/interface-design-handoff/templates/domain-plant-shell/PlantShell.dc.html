<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Domain · Plant Shell" description="The persistent plant-detail frame in Ovanova light: identity + live status + time header and the DS Tabs (line) primitive as the tab bar, over a content slot the active tab fills. A role tweak (or ?role= in the URL) sets the persona and self-labels it with a colored role pill — Aggregator (full, incl. Control), Utility (read-only, no Control), Owner (simplified, no Equipment). Uses the shared <Icon> set, currentColor." -->
<helmet>
<script src="./ds-base.js"></script>
<script src="./icons/icon-data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</helmet>
<div style="background:#F4F6F8; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#20262B; padding:26px 24px; min-height:100%;">
  <div style="max-width:1060px; margin:0 auto;">

    <!-- ===================== PLANT SHELL FRAME ===================== -->
    <div style="background:#fff; border:1px solid #E2E7EB; border-radius:16px; padding:20px 22px 22px; box-shadow:0 1px 2px rgba(16,42,79,0.04), 0 12px 30px rgba(16,42,79,0.06);">

      <!-- header -->
      <div style="display:flex; flex-wrap:wrap; row-gap:14px; align-items:center; justify-content:space-between; gap:18px;">
        <div style="min-width:0;">
          <!-- breadcrumb — root adapts to the persona -->
          <div style="display:flex; align-items:center; gap:8px; font-size:12.5px; color:#8A9199;">
            <sc-if value="{{ isOwner }}" hint-placeholder-val="{{ false }}"><span style="color:#1F4173; font-weight:600;">My Plant</span></sc-if>
            <sc-if value="{{ isAgg }}" hint-placeholder-val="{{ true }}"><span style="font-weight:500; cursor:pointer;" style-hover="color:#03587F">Fleet</span><span style="color:#9AA6AF; font-weight:600; user-select:none;">›</span><span style="color:#1F4173; font-weight:600;">Maple Grove</span></sc-if>
            <sc-if value="{{ isUtil }}" hint-placeholder-val="{{ false }}"><span style="font-weight:500; cursor:pointer;" style-hover="color:#03587F">Territory</span><span style="color:#9AA6AF; font-weight:600; user-select:none;">›</span><span style="color:#1F4173; font-weight:600;">Maple Grove</span></sc-if>
          </div>
          <div style="display:flex; flex-wrap:wrap; align-items:center; gap:12px; row-gap:8px; margin-top:7px;">
            <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:32px; color:#1F4173; letter-spacing:-0.015em; white-space:nowrap;">Maple Grove</span>
            <span style="display:inline-flex; align-items:center; gap:7px; font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:600; color:#03587F; background:#E6F4FC; border:1px solid rgba(0,157,228,0.28); border-radius:999px; padding:4px 11px;">
              <span style="width:7px; height:7px; border-radius:50%; background:#009DE4;"></span>Normal
            </span>
            <!-- role pill — the per-component persona label -->
            <sc-if value="{{ isAgg }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex; align-items:center; gap:7px; font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:600; color:#1F4173; background:#EAF1FB; border:1px solid rgba(31,65,115,0.24); border-radius:999px; padding:4px 11px;"><span style="width:7px; height:7px; border-radius:50%; background:#2A6FDB;"></span>Aggregator</span></sc-if>
            <sc-if value="{{ isUtil }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex; align-items:center; gap:7px; font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:600; color:#8A6412; background:#FBF3E0; border:1px solid rgba(158,116,20,0.30); border-radius:999px; padding:4px 11px;"><span style="width:7px; height:7px; border-radius:50%; background:#C98A1E;"></span>Utility</span></sc-if>
            <sc-if value="{{ isOwner }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex; align-items:center; gap:7px; font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:600; color:#17734B; background:#E7F6ED; border:1px solid rgba(31,138,91,0.30); border-radius:999px; padding:4px 11px;"><span style="width:7px; height:7px; border-radius:50%; background:#1F8A5B;"></span>Owner</span></sc-if>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:12px; background:#F7F9FB; border:1px solid #E6EBEF; border-radius:11px; padding:8px 14px; flex:0 0 auto;">
          <span style="display:inline-flex; align-items:center; gap:7px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; color:#1F4173;"><span style="display:inline-flex; color:#8A9199;"><x-import component-from-global-scope="Icon" from="./icons/Icon.jsx" name="Clock" size="15" hint-size="15px,15px"></x-import></span>14:08</span>
          <span style="width:1px; height:16px; background:#E0E6EA;"></span>
          <span style="display:inline-flex; align-items:center; gap:7px; font-size:13px; color:#5B6A78; white-space:nowrap;"><span style="display:inline-flex; color:#8A9199;"><x-import component-from-global-scope="Icon" from="./icons/Icon.jsx" name="Calendar" size="15" hint-size="15px,15px"></x-import></span>Jul 2</span>
        </div>
      </div>

      <!-- tab bar — DS Tabs · line variant (Navigation group), md size; set adapts per role -->
      <div style="display:flex; flex-wrap:wrap; border-bottom:1px solid #E2E7EB; margin-top:18px;">
        <button type="button" style="border:none; background:transparent; cursor:pointer; padding:9px 14px; font-size:14px; font-weight:600; color:#03587F; box-shadow:inset 0 -2px 0 0 #009DE4; font-family:inherit;">Overview</button>
        <button type="button" style="border:none; background:transparent; cursor:pointer; padding:9px 14px; font-size:14px; font-weight:500; color:#6B7177; font-family:inherit;">Power Flow</button>
        <sc-if value="{{ showEquipment }}" hint-placeholder-val="{{ true }}"><button type="button" style="border:none; background:transparent; cursor:pointer; padding:9px 14px; font-size:14px; font-weight:500; color:#6B7177; font-family:inherit;">Equipment</button></sc-if>
        <sc-if value="{{ showControl }}" hint-placeholder-val="{{ true }}"><button type="button" style="border:none; background:transparent; cursor:pointer; padding:9px 14px; font-size:14px; font-weight:500; color:#6B7177; font-family:inherit;">Control</button></sc-if>
        <button type="button" style="border:none; background:transparent; cursor:pointer; padding:9px 14px; font-size:14px; font-weight:500; color:#6B7177; font-family:inherit; display:inline-flex; align-items:center; gap:7px;">Events <span style="font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700; color:#fff; background:#1F4173; border-radius:999px; padding:1px 8px;">3</span></button>
      </div>

      <!-- content slot -->
      <div style="margin-top:16px; border:1px dashed #D6DFE7; border-radius:12px; background:#FBFCFD; min-height:118px; display:flex; align-items:center; justify-content:center;">
        <span style="font-size:12.5px; color:#A9B4BD; font-family:'Space Grotesk',sans-serif; letter-spacing:0.02em;">Active tab content renders here</span>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1060,&quot;height&quot;:340},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Aggregator&quot;,&quot;Utility&quot;,&quot;Owner&quot;],&quot;default&quot;:&quot;Aggregator&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Shell&quot;}}">
class Component extends DCLogic {
  renderVals() {
    // Persona resolves from ?role= (so the showcase can pin each version),
    // then the role prop/tweak, then Aggregator as the default.
    let role = this.props.role;
    try {
      const u = new URLSearchParams(window.location.search).get("role");
      if (u) role = u;
    } catch (e) {}
    role = role || "Aggregator";
    return {
      isAgg: role === "Aggregator",
      isUtil: role === "Utility",
      isOwner: role === "Owner",
      showEquipment: role !== "Owner",   // Owner: simplified, no Equipment
      showControl: role === "Aggregator" // only the Aggregator can write control
    };
  }
}
</script>
</body>
</html>
