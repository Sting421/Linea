<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="position: relative; display: inline-flex; vertical-align: middle;">
  {{ children }}
  <span style="position:absolute; z-index:20; max-width:240px; width:max-content; background:#1F2A30; color:#EAF0F3; border:1px solid transparent; border-radius:8px; padding:7px 11px; font-family:ui-sans-serif, system-ui, sans-serif; font-size:12.5px; line-height:1.45; box-shadow:0 6px 20px rgba(0,0,0,0.28); pointer-events:none; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%);">
    <sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ false }}">
      <span style="display:block; font-weight:600; font-size:12.5px; color:#EAF0F3; margin-bottom:2px;">{{ title }}</span>
    </sc-if>
    <span style="display:block; color:#EAF0F3;">{{ text }}</span>
    <span style="position:absolute; width:8px; height:8px; background:#1F2A30; border:1px solid transparent; transform:rotate(45deg); top:calc(100% - 4px); left:50%; margin-left:-4px; border-top:none; border-left:none;"></span>
  </span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 280, &quot;height&quot;: 140}, &quot;text&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Helpful context about this control.&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dark&quot;, &quot;light&quot;], &quot;default&quot;: &quot;dark&quot;, &quot;tsType&quot;: &quot;'dark'|'light'&quot;}, &quot;placement&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;top&quot;, &quot;bottom&quot;, &quot;left&quot;, &quot;right&quot;], &quot;default&quot;: &quot;top&quot;, &quot;tsType&quot;: &quot;'top'|'bottom'|'left'|'right'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const title = this.props.title;
    const hasTitle = title != null && title !== "";
    return {
      children: this.props.children,
      hasTitle, title,
      text: this.props.text ?? "Helpful context about this control.",
    };
  }
}
</script>
</body>
</html>
