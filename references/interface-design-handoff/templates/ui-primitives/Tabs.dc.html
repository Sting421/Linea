<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-flex; align-items:stretch; gap:0; font-family:ui-sans-serif, system-ui, sans-serif; border-bottom:1px solid #E2E7EB;">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
    <sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ t.onClick }}" style="position:relative; border:none; background:transparent; cursor:pointer; padding:9px 14px; font-size:14px; font-weight:600; color:#03587F; font-family:inherit; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:color .15s, background .15s; box-shadow:inset 0 -2px 0 0 #009DE4;">
        {{ t.label }}
        <sc-if value="{{ t.showCount }}" hint-placeholder-val="{{ false }}"><span style="font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:600; color:#03587F; background:#E6F7FF; border-radius:999px; padding:1px 7px; font-variant-numeric:tabular-nums;">{{ t.count }}</span></sc-if>
      </button>
    </sc-if>
    <sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ t.onClick }}" style="position:relative; border:none; background:transparent; cursor:pointer; padding:9px 14px; font-size:14px; font-weight:500; color:#6B7177; font-family:inherit; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:color .15s, background .15s;">
        {{ t.label }}
        <sc-if value="{{ t.showCount }}" hint-placeholder-val="{{ false }}"><span style="font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:600; color:#8A9199; background:#EDF0F2; border-radius:999px; padding:1px 7px; font-variant-numeric:tabular-nums;">{{ t.count }}</span></sc-if>
      </button>
    </sc-if>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 460, &quot;height&quot;: 70}, &quot;variant&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;line&quot;, &quot;soft&quot;, &quot;enclosed&quot;], &quot;default&quot;: &quot;line&quot;, &quot;tsType&quot;: &quot;'line'|'soft'|'enclosed'&quot;}, &quot;size&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;sm&quot;, &quot;md&quot;, &quot;lg&quot;], &quot;default&quot;: &quot;md&quot;, &quot;tsType&quot;: &quot;'sm'|'md'|'lg'&quot;}, &quot;activeIndex&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 0, &quot;tsType&quot;: &quot;number&quot;}, &quot;items&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;Array&lt;{ label: string; count?: number }&gt;&quot;}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { active: props.activeIndex != null ? Number(props.activeIndex) : 0 }; }
  renderVals() {
    const items = Array.isArray(this.props.items) && this.props.items.length
      ? this.props.items
      : [{ label: "Overview" }, { label: "Equipment" }, { label: "Events", count: 3 }, { label: "Settings" }];
    const active = this.state.active;
    const tabs = items.map((it, i) => {
      const on = i === active;
      const hasCount = it.count != null && it.count !== "";
      return {
        label: it.label,
        onClick: () => { if (this.props.activeIndex == null) this.setState({ active: i }); },
        on, off: !on,
        showCount: hasCount,
        count: it.count,
      };
    });
    return { tabs };
  }
}
</script>
</body>
</html>
