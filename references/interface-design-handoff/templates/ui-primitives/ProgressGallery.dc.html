<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:24px 26px 26px; background:#fff; font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#1F4173;">

  <div style="margin-bottom:24px;">
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">Color schemes</div>
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; align-items:center; gap:14px;"><span style="width:54px; flex:0 0 auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">blue</span><span style="flex:1; height:9px; border-radius:9px; background:#EDF0F2; overflow:hidden;"><span style="display:block; width:72%; height:100%; border-radius:9px; background:#009DE4;"></span></span></div>
      <div style="display:flex; align-items:center; gap:14px;"><span style="width:54px; flex:0 0 auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">green</span><span style="flex:1; height:9px; border-radius:9px; background:#EDF0F2; overflow:hidden;"><span style="display:block; width:88%; height:100%; border-radius:9px; background:#1FA845;"></span></span></div>
      <div style="display:flex; align-items:center; gap:14px;"><span style="width:54px; flex:0 0 auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">amber</span><span style="flex:1; height:9px; border-radius:9px; background:#EDF0F2; overflow:hidden;"><span style="display:block; width:54%; height:100%; border-radius:9px; background:#E08600;"></span></span></div>
      <div style="display:flex; align-items:center; gap:14px;"><span style="width:54px; flex:0 0 auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">red</span><span style="flex:1; height:9px; border-radius:9px; background:#EDF0F2; overflow:hidden;"><span style="display:block; width:33%; height:100%; border-radius:9px; background:#D92D20;"></span></span></div>
      <div style="display:flex; align-items:center; gap:14px;"><span style="width:54px; flex:0 0 auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">sky</span><span style="flex:1; height:9px; border-radius:9px; background:#EDF0F2; overflow:hidden;"><span style="display:block; width:64%; height:100%; border-radius:9px; background:#03587F;"></span></span></div>
      <div style="display:flex; align-items:center; gap:14px;"><span style="width:54px; flex:0 0 auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">slate</span><span style="flex:1; height:9px; border-radius:9px; background:#EDF0F2; overflow:hidden;"><span style="display:block; width:46%; height:100%; border-radius:9px; background:#6B7177;"></span></span></div>
      <div style="display:flex; align-items:center; gap:14px;"><span style="width:54px; flex:0 0 auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">teal</span><span style="flex:1; height:9px; border-radius:9px; background:#EDF0F2; overflow:hidden;"><span style="display:block; width:58%; height:100%; border-radius:9px; background:#6D5BD0;"></span></span></div>
    </div>
  </div>

  <div style="margin-bottom:24px;">
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">Sizes</div>
    <div style="display:flex; flex-direction:column; gap:13px;">
      <div style="display:flex; align-items:center; gap:14px;"><span style="width:54px; flex:0 0 auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">xs</span><span style="flex:1; height:4px; border-radius:4px; background:#EDF0F2; overflow:hidden;"><span style="display:block; width:60%; height:100%; border-radius:4px; background:#009DE4;"></span></span></div>
      <div style="display:flex; align-items:center; gap:14px;"><span style="width:54px; flex:0 0 auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">sm</span><span style="flex:1; height:6px; border-radius:6px; background:#EDF0F2; overflow:hidden;"><span style="display:block; width:60%; height:100%; border-radius:6px; background:#009DE4;"></span></span></div>
      <div style="display:flex; align-items:center; gap:14px;"><span style="width:54px; flex:0 0 auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">md</span><span style="flex:1; height:9px; border-radius:9px; background:#EDF0F2; overflow:hidden;"><span style="display:block; width:60%; height:100%; border-radius:9px; background:#009DE4;"></span></span></div>
      <div style="display:flex; align-items:center; gap:14px;"><span style="width:54px; flex:0 0 auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">lg</span><span style="flex:1; height:12px; border-radius:12px; background:#EDF0F2; overflow:hidden;"><span style="display:block; width:60%; height:100%; border-radius:12px; background:#009DE4;"></span></span></div>
    </div>
  </div>

  <div>
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">With header</div>
    <div style="max-width:340px;">
      <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:7px;"><span style="font-size:13px; color:#46505A; font-weight:500;">Charge level</span><span style="font-family:'Space Grotesk',sans-serif; font-size:12.5px; color:#6B7177; font-variant-numeric:tabular-nums;">72%</span></div>
      <span style="display:block; height:9px; border-radius:9px; background:#EDF0F2; overflow:hidden;"><span style="display:block; width:72%; height:100%; border-radius:9px; background:#1FA845;"></span></span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 560, &quot;height&quot;: 420}}"></script>
</body>
</html>
