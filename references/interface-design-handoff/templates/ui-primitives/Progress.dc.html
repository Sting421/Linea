<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 100%; font-family: ui-sans-serif, system-ui, sans-serif;">
  <sc-if value="{{ showHeader }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 7px;">
      <span style="font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; color: #46505A; font-weight: 500;">{{ label }}</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; color: #6B7177; font-variant-numeric: tabular-nums;">{{ pctText }}</span>
    </div>
  </sc-if>
  <div style="width:100%; height:9px; border-radius:9px; background:#EDF0F2; overflow:hidden;">
    <div style="width:{{ pct }}%; height:100%; border-radius:9px; background:#009DE4; transition:width .3s ease;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 320, &quot;height&quot;: 60}, &quot;value&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 60, &quot;min&quot;: 0, &quot;max&quot;: 100, &quot;step&quot;: 1, &quot;unit&quot;: &quot;%&quot;, &quot;tsType&quot;: &quot;number&quot;}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Charge level&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;showValue&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;size&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;xs&quot;, &quot;sm&quot;, &quot;md&quot;, &quot;lg&quot;], &quot;default&quot;: &quot;md&quot;, &quot;tsType&quot;: &quot;'xs'|'sm'|'md'|'lg'&quot;}, &quot;colorScheme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;blue&quot;, &quot;green&quot;, &quot;amber&quot;, &quot;red&quot;, &quot;sky&quot;, &quot;slate&quot;, &quot;teal&quot;], &quot;default&quot;: &quot;blue&quot;, &quot;tsType&quot;: &quot;'blue'|'green'|'amber'|'red'|'sky'|'slate'|'teal'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const SCHEME = { blue: "#009DE4", green: "#1FA845", amber: "#E08600", red: "#D92D20", sky: "#03587F", slate: "#6B7177", teal: "#0E9384" };
    const H = { xs: 4, sm: 6, md: 9, lg: 12 };
    const size = this.props.size || "md";
    const h = H[size] || H.md;
    const scheme = this.props.colorScheme || "blue";
    const accent = SCHEME[scheme] || SCHEME.blue;
    let value = Number(this.props.value);
    if (!isFinite(value)) value = 60;
    value = Math.max(0, Math.min(100, value));
    const label = this.props.label;
    const showHeader = (label != null && label !== "") || this.props.showValue;

    return {
      showHeader,
      label: label || "Progress",
      pctText: Math.round(value) + "%",
      pct: Math.round(value),
    };
  }
}
</script>
</body>
</html>
