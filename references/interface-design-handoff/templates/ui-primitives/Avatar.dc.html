<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
</helmet>
<span style="display:inline-flex; position:relative; width:48px; height:48px; flex:0 0 auto; vertical-align:middle;">
  <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ false }}">
    <img src="{{ src }}" alt="{{ name }}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);" />
  </sc-if>
  <sc-if value="{{ showInitials }}" hint-placeholder-val="{{ true }}">
    <span style="width:100%; height:100%; border-radius:50%; background:#E6F7FF; color:#03587F; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:19px; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.06); user-select:none;">{{ initials }}</span>
  </sc-if>
  <sc-if value="{{ stNormal }}" hint-placeholder-val="{{ false }}"><span style="position:absolute; right:0; bottom:0; width:13px; height:13px; border-radius:50%; background:#009DE4; box-shadow:0 0 0 2px #fff;"></span></sc-if>
  <sc-if value="{{ stOnline }}" hint-placeholder-val="{{ true }}"><span style="position:absolute; right:0; bottom:0; width:13px; height:13px; border-radius:50%; background:#1FA845; box-shadow:0 0 0 2px #fff;"></span></sc-if>
  <sc-if value="{{ stWarning }}" hint-placeholder-val="{{ false }}"><span style="position:absolute; right:0; bottom:0; width:13px; height:13px; border-radius:50%; background:#E08600; box-shadow:0 0 0 2px #fff;"></span></sc-if>
  <sc-if value="{{ stOffline }}" hint-placeholder-val="{{ false }}"><span style="position:absolute; right:0; bottom:0; width:13px; height:13px; border-radius:50%; background:#6B7177; box-shadow:0 0 0 2px #fff;"></span></sc-if>
  <sc-if value="{{ stFault }}" hint-placeholder-val="{{ false }}"><span style="position:absolute; right:0; bottom:0; width:13px; height:13px; border-radius:50%; background:#D92D20; box-shadow:0 0 0 2px #fff;"></span></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 90, &quot;height&quot;: 90}, &quot;name&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Ada Powers&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;src&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;size&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;xs&quot;, &quot;sm&quot;, &quot;md&quot;, &quot;lg&quot;, &quot;xl&quot;, &quot;2xl&quot;], &quot;default&quot;: &quot;lg&quot;, &quot;tsType&quot;: &quot;'xs'|'sm'|'md'|'lg'|'xl'|'2xl'&quot;}, &quot;status&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;&quot;, &quot;normal&quot;, &quot;online&quot;, &quot;warning&quot;, &quot;offline&quot;, &quot;fault&quot;], &quot;default&quot;: &quot;online&quot;, &quot;tsType&quot;: &quot;''|'normal'|'online'|'warning'|'offline'|'fault'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const name = this.props.name || "User";
    const src = this.props.src;
    const hasImage = src != null && src !== "";
    const initials = name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
    const status = this.props.status ? String(this.props.status).toLowerCase() : null;
    return {
      hasImage, src, name,
      showInitials: !hasImage, initials,
      stNormal: status === "normal",
      stOnline: status === "online",
      stWarning: status === "warning",
      stOffline: status === "offline",
      stFault: status === "fault",
    };
  }
}
</script>
</body>
</html>
