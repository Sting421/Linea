<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="min-height:150px; padding:24px; display:flex; align-items:center; justify-content:center; gap:40px; background:#fff; font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
  <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
    <span style="width:32px; height:18px; border-radius:18px; background:#009DE4; position:relative; display:inline-block;"><span style="position:absolute; top:2px; left:16px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25);"></span></span>
    <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">on</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
    <span style="width:32px; height:18px; border-radius:18px; background:#CDD1D4; position:relative; display:inline-block;"><span style="position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25);"></span></span>
    <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">off</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 360, &quot;height&quot;: 150}}"></script>
</body>
</html>
