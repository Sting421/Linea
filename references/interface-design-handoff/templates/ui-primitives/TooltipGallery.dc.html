<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:30px 30px 34px; background:#fff; font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#1F4173;">

  <div style="margin-bottom:18px;">
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 10px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">Placements</div>
    <div style="display:flex; flex-wrap:wrap; gap:18px 70px; align-items:center; justify-content:center; padding:56px 40px;">

      <div style="display:flex; flex-direction:column; align-items:center; gap:38px;">
        <span style="position:relative; display:inline-flex;"><button type="button" style="padding:7px 13px; border-radius:8px; background:#EEF2F5; color:#46505A; font-size:13px; font-weight:500; border:1px solid #E2E7EB; cursor:default;">top</button><span style="position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); background:#1F2A30; color:#EAF0F3; border-radius:8px; padding:7px 11px; font-size:12.5px; line-height:1.45; box-shadow:0 6px 20px rgba(0,0,0,.28); width:max-content; max-width:170px; pointer-events:none;">Tooltip text<span style="position:absolute; top:calc(100% - 4px); left:50%; margin-left:-4px; width:8px; height:8px; background:#1F2A30; transform:rotate(45deg);"></span></span></span>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:38px;">
        <span style="position:relative; display:inline-flex;"><button type="button" style="padding:7px 13px; border-radius:8px; background:#EEF2F5; color:#46505A; font-size:13px; font-weight:500; border:1px solid #E2E7EB; cursor:default;">bottom</button><span style="position:absolute; top:calc(100% + 10px); left:50%; transform:translateX(-50%); background:#1F2A30; color:#EAF0F3; border-radius:8px; padding:7px 11px; font-size:12.5px; line-height:1.45; box-shadow:0 6px 20px rgba(0,0,0,.28); width:max-content; max-width:170px; pointer-events:none;">Tooltip text<span style="position:absolute; bottom:calc(100% - 4px); left:50%; margin-left:-4px; width:8px; height:8px; background:#1F2A30; transform:rotate(45deg);"></span></span></span>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:38px;">
        <span style="position:relative; display:inline-flex;"><button type="button" style="padding:7px 13px; border-radius:8px; background:#EEF2F5; color:#46505A; font-size:13px; font-weight:500; border:1px solid #E2E7EB; cursor:default;">left</button><span style="position:absolute; right:calc(100% + 10px); top:50%; transform:translateY(-50%); background:#1F2A30; color:#EAF0F3; border-radius:8px; padding:7px 11px; font-size:12.5px; line-height:1.45; box-shadow:0 6px 20px rgba(0,0,0,.28); width:max-content; max-width:140px; pointer-events:none;">Left side<span style="position:absolute; left:calc(100% - 4px); top:50%; margin-top:-4px; width:8px; height:8px; background:#1F2A30; transform:rotate(45deg);"></span></span></span>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:38px;">
        <span style="position:relative; display:inline-flex;"><button type="button" style="padding:7px 13px; border-radius:8px; background:#EEF2F5; color:#46505A; font-size:13px; font-weight:500; border:1px solid #E2E7EB; cursor:default;">right</button><span style="position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%); background:#1F2A30; color:#EAF0F3; border-radius:8px; padding:7px 11px; font-size:12.5px; line-height:1.45; box-shadow:0 6px 20px rgba(0,0,0,.28); width:max-content; max-width:140px; pointer-events:none;">Right side<span style="position:absolute; right:calc(100% - 4px); top:50%; margin-top:-4px; width:8px; height:8px; background:#1F2A30; transform:rotate(45deg);"></span></span></span>
      </div>

    </div>
  </div>

  <div>
    <div style="font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#5B6A78; margin:0 0 10px; padding-bottom:8px; border-bottom:1px solid #EAEFF3;">Themes &amp; title</div>
    <div style="display:flex; flex-wrap:wrap; gap:24px 130px; align-items:flex-start; justify-content:center; padding:64px 48px 18px;">

      <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
        <span style="position:relative; display:inline-flex;"><button type="button" style="padding:7px 13px; border-radius:8px; background:#EEF2F5; color:#46505A; font-size:13px; font-weight:500; border:1px solid #E2E7EB; cursor:default;">dark</button><span style="position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); background:#1F2A30; color:#EAF0F3; border-radius:8px; padding:7px 11px; font-size:12.5px; line-height:1.45; box-shadow:0 6px 20px rgba(0,0,0,.28); width:max-content; max-width:170px; pointer-events:none;">Default theme<span style="position:absolute; top:calc(100% - 4px); left:50%; margin-left:-4px; width:8px; height:8px; background:#1F2A30; transform:rotate(45deg);"></span></span></span>
        <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">dark</span>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
        <span style="position:relative; display:inline-flex;"><button type="button" style="padding:7px 13px; border-radius:8px; background:#EEF2F5; color:#46505A; font-size:13px; font-weight:500; border:1px solid #E2E7EB; cursor:default;">light</button><span style="position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); background:#fff; color:#20262B; border:1px solid #E2E7EB; border-radius:8px; padding:7px 11px; font-size:12.5px; line-height:1.45; box-shadow:0 6px 20px rgba(31,65,115,.14); width:max-content; max-width:170px; pointer-events:none;">Light theme<span style="position:absolute; top:calc(100% - 4px); left:50%; margin-left:-4px; width:8px; height:8px; background:#fff; border-right:1px solid #E2E7EB; border-bottom:1px solid #E2E7EB; transform:rotate(45deg);"></span></span></span>
        <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">light</span>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
        <span style="position:relative; display:inline-flex;"><button type="button" style="padding:7px 13px; border-radius:8px; background:#EEF2F5; color:#46505A; font-size:13px; font-weight:500; border:1px solid #E2E7EB; cursor:default;">title</button><span style="position:absolute; bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); background:#1F2A30; color:#EAF0F3; border-radius:8px; padding:9px 12px; font-size:12.5px; line-height:1.45; box-shadow:0 6px 20px rgba(0,0,0,.28); width:max-content; max-width:190px; pointer-events:none; text-align:left;"><span style="display:block; font-weight:600; margin-bottom:2px;">State of charge</span><span style="display:block; color:#9FB2BC;">Battery energy available right now.</span><span style="position:absolute; top:calc(100% - 4px); left:50%; margin-left:-4px; width:8px; height:8px; background:#1F2A30; transform:rotate(45deg);"></span></span></span>
        <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:#8A97A3;">with title</span>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 720, &quot;height&quot;: 460}}"></script>
</body>
</html>
