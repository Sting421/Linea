<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Evolved · ChartLabel" description="Brand-evolved chart legend swatch, real status/brand color markers. Reskin target for the reap ChartLabel, which rendered colorless from an undefined bg-highlight utility." -->
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding:30px; display:flex; flex-direction:column; gap:18px; background:#fff;">
  <div style="display:flex; flex-direction:column; gap:11px;">
    <span style="display:flex; align-items:center; gap:9px; font-size:13.5px; color:#20262B;"><span style="width:12px; height:12px; border-radius:3px; background:#009DE4;"></span>Solar production</span>
    <span style="display:flex; align-items:center; gap:9px; font-size:13.5px; color:#20262B;"><span style="width:12px; height:12px; border-radius:3px; background:#1FA845;"></span>Battery charge</span>
    <span style="display:flex; align-items:center; gap:9px; font-size:13.5px; color:#20262B;"><span style="width:12px; height:12px; border-radius:3px; background:#E08600;"></span>Grid import</span>
    <span style="display:flex; align-items:center; gap:9px; font-size:13.5px; color:#20262B;"><span style="width:12px; height:12px; border-radius:3px; background:#D92D20;"></span>Peak demand</span>
    <span style="display:flex; align-items:center; gap:9px; font-size:13.5px; color:#20262B;"><span style="width:12px; height:12px; border-radius:3px; background:#1F4173;"></span>Self-consumption</span>
    <span style="display:flex; align-items:center; gap:9px; font-size:13.5px; color:#20262B;"><span style="width:12px; height:12px; border-radius:3px; background:#6B7177;"></span>Offline</span>
  </div>
  <div style="font-size:12.5px; color:#8A9199; max-width:48ch; border-top:1px solid #EEF2F5; padding-top:14px; line-height:1.6;"><b style="color:#03587F; font-family:'Space Grotesk',sans-serif;">Evolved:</b> real brand &amp; status swatches, fixing the legacy colorless <code style="font-family:'Space Grotesk',monospace;">bg-highlight-*</code> bug. Markers map to <code style="font-family:'Space Grotesk',monospace;">--status-*</code>.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 320, &quot;height&quot;: 280}}"></script>
</body>
</html>
