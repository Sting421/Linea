<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Evolved · DateFilter" description="Brand-evolved date-range filter, calendar-accented pills, Space Grotesk dates. Reskin target for the reap DateFilter." -->
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding:30px; display:flex; flex-direction:column; gap:18px; background:#fff;">
  <div style="display:flex; align-items:center; gap:10px;">
    <span style="display:inline-flex; align-items:center; gap:8px; border:1px solid #CFE0EA; border-radius:10px; padding:9px 13px; background:#fff;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#03587F" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="8" y1="3" x2="8" y2="6"></line><line x1="16" y1="3" x2="16" y2="6"></line></svg>
      <span style="font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:500; color:#20262B;">Jan 1, 2026</span>
    </span>
    <span style="color:#8A9199;">→</span>
    <span style="display:inline-flex; align-items:center; gap:8px; border:1px solid #CFE0EA; border-radius:10px; padding:9px 13px; background:#fff;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#03587F" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="8" y1="3" x2="8" y2="6"></line><line x1="16" y1="3" x2="16" y2="6"></line></svg>
      <span style="font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:500; color:#20262B;">Jan 31, 2026</span>
    </span>
  </div>
  <div style="display:flex; gap:7px;">
    <span style="font-size:12px; font-weight:600; color:#03587F; background:#E6F7FF; border-radius:999px; padding:3px 11px; font-family:'Space Grotesk',sans-serif;">7d</span>
    <span style="font-size:12px; font-weight:500; color:#46505A; background:#F2F5F7; border-radius:999px; padding:3px 11px; font-family:'Space Grotesk',sans-serif;">30d</span>
    <span style="font-size:12px; font-weight:500; color:#46505A; background:#F2F5F7; border-radius:999px; padding:3px 11px; font-family:'Space Grotesk',sans-serif;">90d</span>
  </div>
  <div style="font-size:12.5px; color:#8A9199; max-width:52ch; border-top:1px solid #EEF2F5; padding-top:14px; line-height:1.6;"><b style="color:#03587F; font-family:'Space Grotesk',sans-serif;">Evolved:</b> calendar-accented range pills + quick-range chips (sky selected), replacing the legacy date control.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 520, &quot;height&quot;: 220}}"></script>
</body>
</html>
