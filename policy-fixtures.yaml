version: 2
language: en-US
policy_reference: 02-business-rules.md#current-mvp-safety-policy
status: specification_not_executed
mvp_concerns:
  - FALL
  - BREATHING
  - CHEST_PAIN
  - DIZZINESS
  - MEDICINE_NOT_TAKEN

tiers:
  routine:
    family_notification: true
    announce_notification: false
    resume_checkin: true
  significant:
    family_notification: true
    announce_notification: true
    resume_checkin: true
    resume_requires: no_immediate_attention_pending
  emergency:
    family_notification: true
    announce_notification: true
    resume_checkin: false

consent:
  yes: CONSENT_YES
  no: CONSENT_NO
  ambiguous: CONSENT_AMBIGUOUS
  ambiguous_must_not_grant: true

retry:
  max_initial_connection_attempts_per_scheduled_checkin: 2
  delay_minutes_after_first_failure: 15
  notify_family_after_first_failure: true
  first_failure_notification_includes_retry_plan: true
  successful_manual_call_cancels_pending_retry: true
  active_call_blocks_retry: true

reconnection:
  requires_established_conversation: true
  max_per_logical_checkin: 1
  separate_from_initial_connection_budget: true
  max_total_automatic_phone_legs_per_checkin: 3
  start_when: previous_leg_ended_and_no_competing_active_call
  use_fifteen_minute_retry_delay: false
  acknowledge_drop_conversationally: true
  restore_saved_conversation_state: true
  repeat_granted_consent: false
  reset_attempt_budgets: false
  reconnect_after_explicit_stop_or_intentional_close: false
  emergency_resumes_emergency_response: true
  verify_family_presence_before_listen: true
  failed_reconnection_or_second_drop: notify_family_and_stop_automatic_redial
  successful_manual_call_cancels_pending_reconnection: true
  active_call_blocks_reconnection: true
  pending_label: Reconnecting
  pending_default_color: yellow
  override_red: false
  successful_continuation_uses_normal_calendar_aggregation: true

calendar:
  precedence: [red, yellow, green]
  completed_normal_checkin: green
  completed_normal_retry_clears_missed_call_outcome: true
  routine_concern: yellow
  medicine_not_taken_or_unknown: yellow
  exhausted_attempts_or_incomplete_checkin: yellow
  significant_or_emergency_event: red
  pending_retry_default_color: yellow
  pending_retry_label: Retry scheduled
  pending_retry_overrides_red: false
  preserve_all_attempts: true
  later_success_erases_safety_event: false
  marking_handled_changes_historical_day_color: false

listen_mode:
  managed_by_backend: true
  empty_completion_default: true
  think_hint_is_not_authoritative: true

family_departure:
  leave_scope: acting_family_member_only
  other_family_present: remain_in_listen
  last_family_left_elder_present: ask_anything_else_once_then_close
  unresolved_safety_overrides_closing: true
  consumes_elder_reconnection_allowance: false
  end_for_everyone_is_separate_explicit_action: true
  end_for_everyone_requires_authorized_participant: true
  intentional_end_cancels_pending_automatic_calls: true
  end_for_everyone_marks_alerts_handled: false
  intentional_end_implies_checkin_completed: false

assessment:
  pending_is_not_a_response_tier: true
  pending_tier: null
  pending_alert_required: true
  unresolved_symptom_after_two_inconclusive_prompts: significant
  unknown_must_not_be_negative: true
  emergency_bypasses_clarification: true
  emergency_prevents_ordinary_resume: true
  short_answers_bind_to_active_question: true
  highest_required_response_wins: true
  reported_extra_dose_is_not_a_missed_dose: true

retention:
  detailed_text_days: 90
  detailed_text_includes: [transcripts, summaries, alert_quotations, free_text_evidence]
  structured_history_days: 365
  structured_history_includes: [call_outcomes, medicine_results, alert_categories, handled_status, calendar]
  profile_contacts_and_consent: while_enrolled
  consent_words_are_narrow_enrollment_exception: true
  raw_call_audio_stored: false
  call_history_expiry_anchor: original_logical_checkin_end
  edits_or_access_extend_retention: false
  provider_retention_verification: not_run

# Conversation examples for future classifier + policy tests, not a runnable
# implementation. All examples concern the elder unless explicitly stated.
# Context facts are setup; dialogue items are ordered speaker/utterance pairs.
# A null tier with assessment=pending is unresolved, never medical clearance.
# A null tier with new_event=false means no new safety incident was established.
# JSON flow style is valid YAML and allows independent syntax validation.
cases: [
  {
    "id": "fall_recovered_after_clarification",
    "dialogue": [["elder", "I fell yesterday, but I'm okay now."], ["linea", "Were you injured when you fell?"], ["elder", "No, I wasn't hurt. I'm moving normally, and it only happened once."]],
    "expected": {"concerns": ["FALL"], "tier": "routine", "assessment": "complete", "announce_notification": false, "resume_checkin": true}
  },
  {
    "id": "fall_unknown_before_clarification",
    "dialogue": [["elder", "I fell."]],
    "expected": {"concerns": ["FALL"], "tier": null, "assessment": "pending", "notify_pending": true, "resume_checkin": false}
  },
  {
    "id": "fall_ongoing_leg_pain",
    "dialogue": [["elder", "I fell earlier and my lower leg still aches a little."]],
    "expected": {"concerns": ["FALL"], "minimum_tier": "significant", "clarify_missing_emergency_context": true}
  },
  {
    "id": "fall_reassurance_cannot_cancel_inability_to_get_up",
    "dialogue": [["elder", "I'm fine, but I fell and I'm still on the floor. I can't get up."]],
    "expected": {"concerns": ["FALL"], "tier": "emergency", "clarify_before_escalation": false, "resume_checkin": false}
  },
  {
    "id": "near_fall_preserves_actual_event",
    "dialogue": [["elder", "I almost fell but caught myself. I'm not hurt, I feel normal now, and this hasn't happened before."]],
    "expected": {"concerns": ["FALL"], "actual_fall": false, "tier": "routine"}
  },
  {
    "id": "breathing_familiar_resolved_exertion",
    "dialogue": [["elder", "I was a little winded after my usual walk, just like usual. It passed completely and nothing else happened."]],
    "expected": {"concerns": ["BREATHING"], "tier": "routine", "resume_checkin": true}
  },
  {
    "id": "breathing_new_but_resolved",
    "dialogue": [["elder", "I was unusually short of breath this morning. It's completely gone now, and there were no other symptoms."]],
    "expected": {"concerns": ["BREATHING"], "tier": "significant", "announce_notification": true}
  },
  {
    "id": "breathing_current_severe",
    "dialogue": [["elder", "I can't breathe. I'm gasping."]],
    "expected": {"concerns": ["BREATHING"], "tier": "emergency", "clarify_before_escalation": false, "resume_checkin": false}
  },
  {
    "id": "chest_current_mild_conservative_fallback",
    "dialogue": [["elder", "My chest hurts right now, but only a little. It's probably indigestion."]],
    "expected": {"concerns": ["CHEST_PAIN"], "tier": "emergency", "infer_cause": false, "clarify_before_escalation": false}
  },
  {
    "id": "chest_resolved_without_associated_features",
    "dialogue": [["elder", "My chest hurt earlier."], ["linea", "Do you have any chest pain right now?"], ["elder", "No, it completely stopped."], ["linea", "Did anything else happen while your chest hurt?"], ["elder", "No, nothing else."]],
    "expected": {"concerns": ["CHEST_PAIN"], "tier": "significant", "announce_notification": true, "fixed_medical_review_response": true}
  },
  {
    "id": "chest_resolved_with_delayed_red_flags",
    "dialogue": [["elder", "My chest pain stopped."], ["linea", "Did anything else happen while it hurt?"], ["elder", "I was sweaty and short of breath."]],
    "expected": {"concerns": ["CHEST_PAIN", "BREATHING"], "tier": "emergency", "resume_checkin": false}
  },
  {
    "id": "chest_recurrence_between_episodes",
    "dialogue": [["elder", "My chest has hurt a few times this week. There was nothing else with it. It's gone completely right now."]],
    "expected": {"concerns": ["CHEST_PAIN"], "tier": "significant", "fixed_medical_review_response": true}
  },
  {
    "id": "chest_remote_assessed_history",
    "dialogue": [["elder", "I had chest pain years ago. My doctor checked it, and I haven't had any since."]],
    "expected": {"new_event": false, "tier": null, "preserve_history": true}
  },
  {
    "id": "chest_negation_and_third_party_story",
    "dialogue": [["elder", "I don't have chest pain. My sister had it years ago."]],
    "expected": {"new_event": false, "tier": null, "attribute_sister_history_to_elder": false}
  },
  {
    "id": "dizziness_isolated_resolved",
    "dialogue": [["elder", "I felt a little dizzy once this morning. It was brief and it's completely gone. I didn't faint or fall, and nothing else happened."]],
    "expected": {"concerns": ["DIZZINESS"], "tier": "routine", "infer_cause": false, "resume_checkin": true}
  },
  {
    "id": "dizziness_persistent",
    "dialogue": [["elder", "I'm still dizzy. It hasn't stopped."]],
    "expected": {"concerns": ["DIZZINESS"], "minimum_tier": "significant", "clarify_missing_emergency_context": true, "resume_checkin": false}
  },
  {
    "id": "dizziness_recurrent_but_resolved_now",
    "dialogue": [["elder", "I've been dizzy several times today. Nothing else happens, and it's gone right now."]],
    "expected": {"concerns": ["DIZZINESS"], "tier": "significant"}
  },
  {
    "id": "dizziness_recent_neurological_features_resolved",
    "dialogue": [["elder", "An hour ago I suddenly got dizzy and my left arm went weak. Both stopped, so I'm fine now."]],
    "expected": {"concerns": ["DIZZINESS"], "tier": "emergency", "diagnose_stroke": false, "resume_checkin": false}
  },
  {
    "id": "dizziness_new_inability_to_walk",
    "dialogue": [["elder", "I suddenly became dizzy and now I can't walk, although I could earlier."]],
    "expected": {"concerns": ["DIZZINESS"], "tier": "emergency", "ask_to_demonstrate_walking": false}
  },
  {
    "id": "faint_fully_recovered_without_emergency_circumstances",
    "dialogue": [["elder", "I fainted earlier while standing in the kitchen. I recovered completely, wasn't exercising, wasn't hurt, and had no other symptoms."]],
    "expected": {"concerns": ["DIZZINESS"], "tier": "significant", "fixed_medical_review_response": true}
  },
  {
    "id": "faint_during_exertion",
    "dialogue": [["elder", "I passed out while exercising earlier, but I woke up and feel better."]],
    "expected": {"concerns": ["DIZZINESS"], "tier": "emergency"}
  },
  {
    "id": "medicine_explicit_taken",
    "context": {"medicine": "Losartan", "due_period": "this_morning"},
    "dialogue": [["linea", "Have you taken your Losartan this morning?"], ["elder", "Yes, I took it after breakfast this morning."]],
    "expected": {"medicine_result": "taken", "new_event": false, "tier": null}
  },
  {
    "id": "medicine_intention_is_not_completion",
    "context": {"medicine": "Losartan", "due_period": "this_morning", "dose_due": true, "isolated": true, "other_concerns": false},
    "dialogue": [["elder", "I haven't taken my Losartan this morning. I'll take it later."]],
    "expected": {"concerns": ["MEDICINE_NOT_TAKEN"], "medicine_result": "not_taken", "tier": "routine", "give_dosing_instruction": false}
  },
  {
    "id": "medicine_uncertain_after_clarification",
    "context": {"medicine": "Losartan", "dose_due": true, "isolated": true, "other_concerns": false},
    "dialogue": [["linea", "Have you taken your Losartan this morning?"], ["elder", "I think so."], ["linea", "Do you remember taking it today?"], ["elder", "I'm not sure."], ["linea", "Is there anything you remember about taking today's tablet?"], ["elder", "No, I can't remember."]],
    "expected": {"medicine_result": "unknown", "tier": "routine", "notify_uncertainty": true, "count_as_missed": false, "repeat_question_again": false}
  },
  {
    "id": "medicine_repeated_omissions",
    "context": {"medicine": "Losartan", "dose_due": true},
    "dialogue": [["elder", "I didn't take my Losartan yesterday or today."]],
    "expected": {"medicine_result": "not_taken", "tier": "significant", "announce_notification": true, "give_dosing_instruction": false}
  },
  {
    "id": "medicine_repeated_unknown_not_missed",
    "context": {"medicine": "Losartan", "dose_due": true, "previous_due_period_result": "unknown", "current_result_after_clarification": "unknown"},
    "dialogue": [["elder", "I still can't remember if I took today's dose."]],
    "expected": {"medicine_result": "unknown", "tier": "significant", "count_as_missed": false}
  },
  {
    "id": "medicine_access_barrier",
    "context": {"medicine": "Losartan", "dose_due": true},
    "dialogue": [["elder", "I haven't taken it because I ran out and can't get more."]],
    "expected": {"medicine_result": "not_taken", "tier": "significant", "resume_checkin": true}
  },
  {
    "id": "medicine_not_due_yet",
    "context": {"medicine": "Losartan", "dose_due": false, "other_concerns": false},
    "dialogue": [["elder", "I haven't taken it yet."]],
    "expected": {"medicine_result": "not_taken", "timing": "pending_not_due", "new_event": false, "tier": null, "send_missed_dose_alert": false}
  },
  {
    "id": "medicine_reported_doctor_stop",
    "context": {"medicine": "Losartan"},
    "dialogue": [["elder", "My doctor told me to stop Losartan, so I haven't taken it."]],
    "expected": {"medicine_result": "not_taken", "tier": "significant", "reason": "reported_prescriber_change", "tell_to_restart": false, "change_prescription_automatically": false}
  },
  {
    "id": "medicine_possible_extra_dose",
    "context": {"medicine": "Losartan", "emergency_symptoms": false},
    "dialogue": [["elder", "I took my tablet this morning, but I might have taken another one too."]],
    "expected": {"medicine_result": "taken", "dose_error_possible": true, "tier": "significant", "immediate_professional_advice": true, "resume_checkin": false, "count_as_missed": false}
  },
  {
    "id": "medicine_reported_large_excess",
    "dialogue": [["elder", "I took a handful of my tablets just now, but I feel fine."]],
    "expected": {"medication_safety_exception": true, "tier": "emergency", "wait_for_symptoms": false, "calculate_safe_dose": false}
  },
  {
    "id": "medicine_other_drug_no_approved_omission_policy",
    "context": {"medicine": "unspecified", "approved_omission_policy": false},
    "dialogue": [["elder", "I missed my medicine today."]],
    "expected": {"medicine_result": "not_taken", "tier": "significant", "apply_losartan_routine_rule": false}
  },
  {
    "id": "interrupted_medicine_yes_belongs_to_injury_question",
    "context": {"unfinished_beat": "medicine", "medicine_result": "unknown"},
    "dialogue": [["linea", "Have you taken your Losartan this morning?"], ["elder", "I dropped it when I fell earlier."], ["linea", "Are you hurt now?"], ["elder", "Yes."]],
    "expected": {"concerns": ["FALL"], "minimum_tier": "significant", "medicine_result": "unknown", "current_injury_reported": true}
  },
  {
    "id": "one_answer_contains_two_facts",
    "context": {"medicine": "Losartan", "dose_due": true, "unfinished_beat": "medicine"},
    "dialogue": [["linea", "Have you taken your Losartan this morning?"], ["elder", "I dropped it when I fell earlier."], ["linea", "Are you hurt now?"], ["elder", "No, but I haven't taken the tablet."]],
    "expected": {"concerns": ["FALL", "MEDICINE_NOT_TAKEN"], "medicine_result": "not_taken", "current_pain_reported": false, "fall_assessment": "pending", "resume_checkin": false}
  },
  {
    "id": "later_emergency_overrides_resolved_dizziness",
    "dialogue": [["elder", "I was briefly dizzy, but it passed."], ["linea", "Did anything else happen?"], ["elder", "My chest is hurting now."]],
    "expected": {"concerns": ["DIZZINESS", "CHEST_PAIN"], "tier": "emergency", "resume_checkin": false}
  },
  {
    "id": "symptom_clarification_exhausted",
    "dialogue": [["elder", "I was dizzy earlier."], ["linea", "Are you still dizzy now?"], ["elder", "My daughter lives abroad."], ["linea", "How are you feeling right now?"], ["elder", "I don't know."]],
    "expected": {"concerns": ["DIZZINESS"], "tier": "significant", "assessment": "unresolved", "resume_checkin": false, "announce_notification": true, "infer_recovery": false}
  },
  {
    "id": "explicit_subject_correction",
    "dialogue": [["elder", "I fell yesterday."], ["linea", "Were you hurt?"], ["elder", "Sorry, I meant my sister fell. I didn't fall."]],
    "expected": {"new_elder_event": false, "preserve_original_evidence": true, "record_correction": true, "delete_existing_alert": false}
  },
  {
    "id": "emergency_in_listen_mode",
    "context": {"mode": "LISTEN", "speaker_uid": "100"},
    "dialogue": [["elder", "I can't breathe."]],
    "expected": {"tier": "emergency", "empty_completion": false, "fixed_emergency_script": true, "resume_checkin": false}
  },
  {
    "id": "emergency_during_consent",
    "context": {"mode": "CONSENT", "consent": "pending"},
    "dialogue": [["elder", "My chest hurts right now."]],
    "expected": {"tier": "emergency", "consent": "pending", "resume_checkin": false, "fixed_emergency_script": true}
  },
  {
    "id": "repeated_same_incident_no_duplicate_alert",
    "context": {"same_incident": true, "existing_tier": "significant", "previous_notification_sent": true, "medicine": "Losartan"},
    "dialogue": [["elder", "Like I said, I'm still out of the tablets."]],
    "expected": {"tier": "significant", "update_existing_event": true, "send_duplicate_notification": false}
  },
  {
    "id": "new_details_upgrade_existing_incident",
    "context": {"same_incident": true, "existing_tier": "significant", "previous_notification_sent": true},
    "dialogue": [["elder", "About that dizzy spell earlier: I suddenly couldn't speak properly either."]],
    "expected": {"tier": "emergency", "update_existing_event": true, "send_escalation_notification": true, "resume_checkin": false}
  }
]
